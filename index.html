<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tienes Una Invitación Especial</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería para las serpentinas (Confeti) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <h1 class="titulo-invitacion" id="titulo">Tienes Una Invitación Especial!!</h1>

  <div class="contenedor-sobre" id="sobre">
    <div class="sobre-trasero"></div>
    
    <div class="tarjeta-invitacion" id="tarjeta">
      <img src="invitacion.jpg" alt="Invitación" class="foto-invitacion">
    </div>

    <div class="sobre-frente"></div>

    <div class="solapa-frontal" id="solapa"></div>

    <div class="sello-cera" id="sello">
      <span class="conejito">🐇</span>
    </div>
  </div>

  <p class="instruccion" id="instruccion">✨ Toca el sobre para abrirlo ✨</p>
  
  <button class="boton-cerrar" id="boton-cerrar">✕</button>

  <audio id="musica" src="cumpleaños.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
